name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: emcos
          POSTGRES_PASSWORD: emcos
          POSTGRES_DB: emcos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emcos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://emcos:emcos@localhost:5432/emcos_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && echo 'run gofmt' && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1 -race

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npx tsc -p tsconfig.json
      - run: npm run test:quality
      - run: npm run build
      - run: node --test tests/preview.test.mjs
      - run: node --test tests/sourceComparison.test.mjs
      - run: node --test tests/gisSnapshot.test.mjs
      - run: NODE_ENV=production node --test tests/windows.test.mjs
      - run: node scripts/build-preview.mjs
