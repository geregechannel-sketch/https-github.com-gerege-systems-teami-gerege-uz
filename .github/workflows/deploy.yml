name: Deploy

# Deploys the backend to toshi.gerege.mn after CI passes on the default branch.
# Server: docker compose (api+db) behind host nginx (TLS via certbot, one-time).
# Requires repo secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY,
# JWT_SECRET, POSTGRES_PASSWORD, SEED_ADMIN_PASSWORD.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [master, main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY JWT_SECRET POSTGRES_PASSWORD SEED_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing deployment secret: $name"
              exit 1
            fi
          done
          echo "BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "VITE_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build frontend
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: frontend

      - name: Setup SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync backend + frontend to server
        run: |
          rsync -az --delete --exclude '.env' --exclude 'bin/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            backend/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/toshi/backend/"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            frontend/dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/toshi/frontend/"

      - name: Write .env and deploy stack
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<EOF
          set -e
          cd /opt/toshi/backend
          cat > .env <<ENV
          POSTGRES_USER=emcos
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=emcos
          JWT_SECRET=${JWT_SECRET}
          SEED_ADMIN_USER=admin
          SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
          BUILD_COMMIT=${BUILD_COMMIT}
          ENV
          # install host nginx site (self-contained: static SPA + /ec3api proxy + TLS).
          # Only apply once the Let's Encrypt cert exists, so nginx -t never fails.
          if [ -f /etc/letsencrypt/live/toshi.gerege.mn/fullchain.pem ]; then
            cp deploy/nginx-toshi.conf /etc/nginx/sites-available/toshi.gerege.mn
            ln -sf /etc/nginx/sites-available/toshi.gerege.mn /etc/nginx/sites-enabled/toshi.gerege.mn
            nginx -t && systemctl reload nginx || true
          fi
          # monitor.toshi.gerege.mn: once DNS points here, serve the ACME challenge
          # over HTTP, issue the cert, then install the full TLS site.
          M=monitor.toshi.gerege.mn
          if [ ! -f /etc/letsencrypt/live/\$M/fullchain.pem ] && getent hosts \$M >/dev/null; then
            mkdir -p /var/www/certbot
            sed '/# TLS-BEGIN/,\$d' deploy/nginx-monitor.conf > /etc/nginx/sites-available/\$M
            ln -sf /etc/nginx/sites-available/\$M /etc/nginx/sites-enabled/\$M
            nginx -t && systemctl reload nginx
            certbot certonly --webroot -w /var/www/certbot -d \$M --non-interactive --agree-tos --register-unsafely-without-email || true
          fi
          if [ -f /etc/letsencrypt/live/\$M/fullchain.pem ]; then
            cp deploy/nginx-monitor.conf /etc/nginx/sites-available/\$M
            ln -sf /etc/nginx/sites-available/\$M /etc/nginx/sites-enabled/\$M
            nginx -t && systemctl reload nginx || true
          fi
          # build + run api + db
          docker compose -f docker-compose.deploy.yml --env-file .env up -d --build
          docker image prune -f
          EOF

      - name: Smoke check
        run: |
          for i in $(seq 1 10); do
            curl -fsS https://toshi.gerege.mn/health && break || sleep 5
          done
          curl -fsS https://toshi.gerege.mn/health
          curl -fsS https://toshi.gerege.mn/ | grep -q "TEAMI Enterprise" && echo "frontend OK"
          curl -fsS https://toshi.gerege.mn/version.json > /tmp/frontend-version.json
          curl -fsS https://toshi.gerege.mn/health > /tmp/backend-health.json
          node -e 'const fs=require("fs"); const f=JSON.parse(fs.readFileSync("/tmp/frontend-version.json")); const h=JSON.parse(fs.readFileSync("/tmp/backend-health.json")); if(f.build_commit!==process.env.BUILD_COMMIT || h.data?.build_commit!==process.env.BUILD_COMMIT || h.data?.device_simulation!==false) process.exit(1);'
          curl -fsSI https://toshi.gerege.mn/assets/gis/pinGreen.png | grep -qi 'content-type: image/png'
