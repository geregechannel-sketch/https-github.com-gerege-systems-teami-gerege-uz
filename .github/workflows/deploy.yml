name: Deploy

# Deploys the backend to toshi.gerege.mn after CI passes on master.
# Requires repo secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY,
# and (recommended) JWT_SECRET, POSTGRES_PASSWORD, SEED_ADMIN_PASSWORD.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # only deploy if CI succeeded (or when manually dispatched)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync backend to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            backend/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/toshi/backend/"

      - name: Write .env and deploy
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<EOF
          set -e
          cd /opt/toshi/backend
          cat > .env <<ENV
          POSTGRES_USER=emcos
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-emcos}
          POSTGRES_DB=emcos
          JWT_SECRET=${JWT_SECRET:-please-set-a-secret}
          SEED_ADMIN_USER=admin
          SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-admin123}
          ENV
          docker compose -f docker-compose.deploy.yml --env-file .env up -d --build
          docker image prune -f
          EOF

      - name: Smoke check
        run: |
          sleep 8
          curl -fsS https://toshi.gerege.mn/health || curl -fsS http://${{ secrets.DEPLOY_HOST }}:8080/health
