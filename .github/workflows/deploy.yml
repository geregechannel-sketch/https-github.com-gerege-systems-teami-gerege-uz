name: Deploy

# Deploys the backend to toshi.gerege.mn after CI passes on the default branch.
# Server: docker compose (api+db) behind host nginx (TLS via certbot, one-time).
# Requires repo secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY,
# JWT_SECRET, POSTGRES_PASSWORD, SEED_ADMIN_PASSWORD.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [master, main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: frontend

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync backend + frontend to server
        run: |
          rsync -az --delete --exclude '.env' --exclude 'bin/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            backend/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/toshi/backend/"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            frontend/dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/toshi/frontend/"

      - name: Write .env and deploy stack
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<EOF
          set -e
          cd /opt/toshi/backend
          cat > .env <<ENV
          POSTGRES_USER=emcos
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=emcos
          JWT_SECRET=${JWT_SECRET}
          SEED_ADMIN_USER=admin
          SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
          ENV
          # install host nginx site (self-contained: static SPA + /ec3api proxy + TLS).
          # Only apply once the Let's Encrypt cert exists, so nginx -t never fails.
          if [ -f /etc/letsencrypt/live/toshi.gerege.mn/fullchain.pem ]; then
            cp deploy/nginx-toshi.conf /etc/nginx/sites-available/toshi.gerege.mn
            ln -sf /etc/nginx/sites-available/toshi.gerege.mn /etc/nginx/sites-enabled/toshi.gerege.mn
            nginx -t && systemctl reload nginx || true
          fi
          # monitor.toshi.gerege.mn: once DNS points here, serve the ACME challenge
          # over HTTP, issue the cert, then install the full TLS site.
          M=monitor.toshi.gerege.mn
          if [ ! -f /etc/letsencrypt/live/\$M/fullchain.pem ] && getent hosts \$M >/dev/null; then
            mkdir -p /var/www/certbot
            sed '/# TLS-BEGIN/,\$d' deploy/nginx-monitor.conf > /etc/nginx/sites-available/\$M
            ln -sf /etc/nginx/sites-available/\$M /etc/nginx/sites-enabled/\$M
            nginx -t && systemctl reload nginx
            certbot certonly --webroot -w /var/www/certbot -d \$M --non-interactive --agree-tos --register-unsafely-without-email || true
          fi
          if [ -f /etc/letsencrypt/live/\$M/fullchain.pem ]; then
            cp deploy/nginx-monitor.conf /etc/nginx/sites-available/\$M
            ln -sf /etc/nginx/sites-available/\$M /etc/nginx/sites-enabled/\$M
            nginx -t && systemctl reload nginx || true
          fi
          # build + run api + db
          docker compose -f docker-compose.deploy.yml --env-file .env up -d --build
          docker image prune -f
          EOF

      - name: Smoke check
        run: |
          for i in $(seq 1 10); do
            curl -fsS https://toshi.gerege.mn/health && break || sleep 5
          done
          curl -fsS https://toshi.gerege.mn/health
          curl -fsS https://toshi.gerege.mn/ | grep -q "TEAMI Enterprise" && echo "frontend OK"
