services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emcos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emcos}
      POSTGRES_DB: ${POSTGRES_DB:-emcos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emcos}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-emcos}:${POSTGRES_PASSWORD:-emcos}@db:5432/${POSTGRES_DB:-emcos}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me}
      SEED_ADMIN_USER: ${SEED_ADMIN_USER:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      ADDR: ":8080"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
