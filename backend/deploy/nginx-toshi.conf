# toshi.gerege.mn — SPA frontend (static) + EC3 API (docker 127.0.0.1:8080).
# Self-contained (includes TLS from certbot's issued cert), so the deploy workflow
# can re-apply it idempotently. certbot renewals only refresh the cert files.

server {
    listen 80;
    listen [::]:80;
    server_name toshi.gerege.mn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name toshi.gerege.mn;

    ssl_certificate     /etc/letsencrypt/live/toshi.gerege.mn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toshi.gerege.mn/privkey.pem;

    # API (docker) + health
    location /ec3api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8080;
    }

    # SPA static (client-side routing fallback to index.html)
    root /opt/toshi/frontend;
    index index.html;
    # index.html must revalidate so a deploy reaches browsers immediately;
    # hashed /assets/* stay cacheable.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri /index.html;
    }
}
