# monitor.toshi.gerege.mn — same SPA bundle + API as toshi.gerege.mn; the SPA
# renders the real-time monitor at "/" on this host. The deploy workflow
# installs only the port-80 block until certbot has issued the cert.

server {
    listen 80;
    listen [::]:80;
    server_name monitor.toshi.gerege.mn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# TLS-BEGIN
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name monitor.toshi.gerege.mn;

    ssl_certificate     /etc/letsencrypt/live/monitor.toshi.gerege.mn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.toshi.gerege.mn/privkey.pem;

    location /ec3api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8080;
    }

    root /opt/toshi/frontend;
    index index.html;
    # index.html must revalidate so a deploy reaches browsers immediately;
    # hashed /assets/* stay cacheable.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri /index.html;
    }
}
